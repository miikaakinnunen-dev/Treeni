<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treenikirja</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f5f7fa;color:#1e293b;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;padding:20px;border-radius:16px;margin-bottom:20px;text-align:center}
.header h1{font-size:1.8rem;margin-bottom:4px}
.header p{opacity:.9;font-size:.9rem}
.nav{display:flex;gap:8px;margin-bottom:20px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.nav button{flex:1;padding:12px;border:none;background:transparent;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;color:#64748b;transition:.2s}
.nav button.active{background:#1e293b;color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:1.1rem;margin-bottom:12px;color:#1e293b}
input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:8px;font-size:1rem;margin-bottom:10px;font-family:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:#3b82f6}
.exercise-row{background:#f8fafc;padding:12px;border-radius:8px;margin-bottom:8px}
.exercise-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.exercise-header input{flex:1;margin:0}
.exercise-header select{flex:1;margin:0;font-size:.9rem}
.set-row{display:grid;grid-template-columns:80px 80px 80px 40px;gap:8px;margin-bottom:6px;align-items:center}
.set-row input{margin:0;padding:8px;font-size:.9rem}
.set-num{font-weight:600;color:#64748b;text-align:center;font-size:.9rem}
.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;transition:.2s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#fff}
.btn-full{width:100%}
.btn:active{transform:scale(.98)}
.add-btn{background:#f1f5f9;border:2px dashed #cbd5e1;color:#64748b;padding:12px;border-radius:8px;cursor:pointer;font-weight:600;width:100%;margin-top:8px;font-size:.9rem}
.add-btn:hover{background:#e2e8f0}
.remove-exercise-btn{background:#fee2e2;border:none;color:#ef4444;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;white-space:nowrap}
.remove-exercise-btn:hover{background:#fecaca}
.remove-set-btn{background:transparent;border:none;color:#ef4444;cursor:pointer;font-size:1.1rem;padding:4px}
.remove-set-btn:hover{color:#b91c1c}
.workout-item{border-left:4px solid #3b82f6;cursor:pointer;transition:.2s}
.workout-item:hover{background:#f8fafc}
.workout-item.expanded{border-left-color:#22c55e}
.workout-item.locked{border-left-color:#94a3b8;opacity:.85}
.workout-summary{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.workout-date{font-size:.85rem;color:#64748b}
.workout-name{font-size:1rem;font-weight:600}
.workout-status{display:flex;align-items:center;gap:6px;font-size:.8rem;margin-top:4px}
.status-badge{padding:3px 8px;border-radius:12px;font-size:.75rem;font-weight:600}
.status-open{background:#dbeafe;color:#1e40af}
.status-locked{background:#e2e8f0;color:#475569}
.workout-arrow{font-size:1.2rem;color:#94a3b8;transition:transform .2s}
.workout-item.expanded .workout-arrow{transform:rotate(180deg)}
.workout-details{padding:0 0 12px 0;display:none}
.workout-item.expanded .workout-details{display:block}
.exercise-item{margin-bottom:12px;padding:10px;background:#f8fafc;border-radius:8px}
.exercise-name{font-weight:600;font-size:.95rem;margin-bottom:6px;color:#1e293b}
.set-info{font-size:.85rem;color:#64748b;margin-left:12px;padding:3px 0}
.set-info.filled{color:#1e293b;font-weight:500}
.delete-btn{background:transparent;border:none;color:#ef4444;cursor:pointer;font-size:1.1rem;padding:8px}
.edit-btn{background:#3b82f6;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem}
.edit-btn:hover{background:#2563eb}
.lock-btn{background:#22c55e;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;margin-top:8px}
.lock-btn:hover{background:#16a34a}
.unlock-btn{background:#64748b;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;margin-top:8px}
.unlock-btn:hover{background:#475569}
.empty{text-align:center;padding:40px;color:#94a3b8}
.empty i{font-size:3rem;margin-bottom:12px;display:block}
.filter{display:flex;gap:8px;margin-bottom:12px}
.filter input{flex:1;margin:0}
.category-label{font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:8px}
.data-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.data-btn{padding:14px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.data-btn:active{transform:scale(.98)}
.export-btn{background:#3b82f6;color:#fff}
.import-btn{background:#8b5cf6;color:#fff}
.data-info{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.85rem;color:#0369a1}
.editing-banner{background:#fef3c7;border:1px solid #fbbf24;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.85rem;color:#92400e;display:flex;justify-content:space-between;align-items:center}
.editing-banner button{background:#f59e0b;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem}
@media(max-width:480px){
  .set-row{grid-template-columns:60px 60px 60px 36px;gap:6px}
  .set-row input{padding:6px;font-size:.85rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Treenikirja</h1>
    <p>Kirjaa treenisi ja seuraa kehitystä</p>
  </div>
  
  <div class="nav">
    <button id="navOverview" class="active">Yleiskatsaus</button>
    <button id="navLog">Kirjaa treeni</button>
  </div>
  
  <div id="pageOverview">
    <div class="card">
      <h2>💾 Tiedostojen hallinta</h2>
      <div class="data-info">
        💡 <strong>Vinkki:</strong> Vie tiedot säännöllisesti varmuuskopiona. Jos puhelin vaihtuu, voit tuoda tiedoston takaisin Tuo tiedot -napilla.
      </div>
      <div class="data-buttons">
        <button class="data-btn export-btn" id="exportBtn">
          💾 Vie tiedot
        </button>
        <button class="data-btn import-btn" id="importBtn">
          📥 Tuo tiedot
        </button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <div id="importStatus" style="text-align:center;font-size:.85rem;margin-top:8px"></div>
    </div>
    
    <div class="card">
      <h2>Viimeisimmät treenit</h2>
      <div class="filter">
        <input type="text" id="searchInput" placeholder="Hae treeniä...">
      </div>
      <div id="workoutList"></div>
    </div>
  </div>
  
  <div id="pageLog" style="display:none">
    <div id="editingBanner" style="display:none"></div>
    <div class="card">
      <h2 id="logTitle">Uusi treeni</h2>
      <input type="date" id="workoutDate">
      <input type="text" id="workoutName" placeholder="Treenin nimi (esim. Push day)">
      <div id="exercisesList"></div>
      <button class="add-btn" id="addExercise">+ Lisää liike</button>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn btn-success btn-full" id="saveWorkout">Tallenna treeni</button>
      </div>
    </div>
  </div>
</div>

<script>

let currentExercises=[];

function buildExerciseOptions(){
  let html='<option value="">-- Valitse liike --</option>';
  for(const [category, exercises] of Object.entries(exerciseBank)){
    html+=`<optgroup label="${category}">`;
    exercises.forEach(ex=>{
      html+=`<option value="${ex}">${ex}</option>`;
    });
    html+=`</optgroup>`;
  }
  return html;
}

function saveToStorage(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(workouts));
}

function generateId(){
  return Date.now().toString(36)+Math.random().toString(36).substr(2);
}

function formatDate(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('fi-FI',{weekday:'short',day:'numeric',month:'short'});
}

function toggleWorkout(id){
  if(expandedWorkouts.has(id)){
    expandedWorkouts.delete(id);
  } else {
    expandedWorkouts.add(id);
  }
  renderWorkoutList();
}

function editWorkout(id){
  const workout=workouts.find(w=>w.id===id);
  if(!workout) return;
  
  editingWorkoutId=id;
  currentExercises=workout.exercises.map(ex=>({
    name:ex.name,
    sets:ex.sets.map(s=>({reps:s.reps||'',weight:s.weight||''}))
  }));
  
  document.getElementById('workoutDate').value=workout.date;
  document.getElementById('workoutName').value=workout.name||'';
  
  document.getElementById('pageOverview').style.display='none';
  document.getElementById('pageLog').style.display='block';
  document.getElementById('navOverview').classList.remove('active');
  document.getElementById('navLog').classList.add('active');
  
  const banner=document.getElementById('editingBanner');
  banner.style.display='flex';
  banner.innerHTML=`
    <div>✏️ Muokataan treeniä: <strong>${workout.name||'Nimetön'}</strong> (${formatDate(workout.date)})</div>
    <button onclick="cancelEdit()">Peruuta</button>
  `;
  
  document.getElementById('logTitle').textContent='Muokkaa treeniä';
  renderExercises();
}

window.cancelEdit=function(){
  editingWorkoutId=null;
  currentExercises=[];
  document.getElementById('editingBanner').style.display='none';
  document.getElementById('logTitle').textContent='Uusi treeni';
  document.getElementById('workoutName').value='';
  document.getElementById('workoutDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('pageOverview').style.display='block';
  document.getElementById('pageLog').style.display='none';
  document.getElementById('navLog').classList.remove('active');
  document.getElementById('navOverview').classList.add('active');
  renderWorkoutList();
};

function lockWorkout(id){
  const workout=workouts.find(w=>w.id===id);
  if(workout && confirm('Lukitse tämä treeni? Treeniä ei voi enää muokata.')){
    workout.locked=true;
    saveToStorage();
    renderWorkoutList();
  }
}

function unlockWorkout(id){
  const workout=workouts.find(w=>w.id===id);
  if(workout && confirm('Avaa lukitus? Treeniä voi taas muokata.')){
    workout.locked=false;
    saveToStorage();
    renderWorkoutList();
  }
}

function exportData(){
  if(workouts.length===0){
    alert('Ei treenejä vietävänä. Kirjaa ensin treeni!');
    return;
  }
  
  const data={
    version:'1.0',
    exportDate:new Date().toISOString(),
    workoutCount:workouts.length,
    workouts:workouts
  };
  
  const jsonStr=JSON.stringify(data,null,2);
  const blob=new Blob([jsonStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  
  const a=document.createElement('a');
  a.href=url;
  const date=new Date().toISOString().split('T')[0];
  a.download=`treenikirja_${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  alert(`✅ Tiedot viety!\n\n${workouts.length} treeniä tallennettu tiedostoon.\n\nSäilytä tiedosto turvallisessa paikassa. Voit tuoda sen takaisin Tuo tiedot -napilla.`);
}

function importData(file){
  const reader=new FileReader();
  const statusEl=document.getElementById('importStatus');
  
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      
      if(!imported.workouts||!Array.isArray(imported.workouts)){
        throw new Error('Virheellinen tiedostomuoto');
      }
      
      const count=imported.workouts.length;
      
      if(confirm(`Tiedostosta löytyy ${count} treeniä.\n\nHaluatko:\n• OK = Korvaa nykyiset treenit\n• Peruuta = Peruuta tuonti`)){
        workouts=imported.workouts;
        saveToStorage();
        expandedWorkouts.clear();
        renderWorkoutList();
        statusEl.innerHTML=`<span style="color:#22c55e">✅ Tuonti onnistui! ${count} treeniä ladattu.</span>`;
        setTimeout(()=>{statusEl.innerHTML='';},5000);
      }
    }catch(err){
      statusEl.innerHTML=`<span style="color:#ef4444">❌ Virhe: ${err.message}</span>`;
      setTimeout(()=>{statusEl.innerHTML='';},5000);
    }
  };
  
  reader.onerror=function(){
    statusEl.innerHTML='<span style="color:#ef4444">❌ Tiedoston lukeminen epäonnistui</span>';
    setTimeout(()=>{statusEl.innerHTML='';},5000);
  };
  
  reader.readAsText(file);
}

function renderWorkoutList(){
  const list=document.getElementById('workoutList');
  const searchTerm=document.getElementById('searchInput').value.toLowerCase();
  
  const filtered=workouts.filter(w=>
    w.name.toLowerCase().includes(searchTerm)||
    w.date.includes(searchTerm)
  ).sort((a,b)=>new Date(b.date)-new Date(a.date));
  
  if(filtered.length===0){
    list.innerHTML='<div class="empty"><i>📋</i>Ei treenejä vielä. Aloita kirjaamalla ensimmäinen treeni!</div>';
    return;
  }
  
  list.innerHTML=filtered.map(w=>{
    const isExpanded=expandedWorkouts.has(w.id);
    const isLocked=w.locked===true;
    
    let statusBadge='';
    if(isLocked){
      statusBadge='<span class="status-badge status-locked">🔒 Lukittu</span>';
    } else {
      statusBadge='<span class="status-badge status-open">✏️ Muokattavissa</span>';
    }
    
    return `
      <div class="card workout-item ${isExpanded?'expanded':''} ${isLocked?'locked':''}" onclick="toggleWorkout('${w.id}')">
        <div class="workout-summary">
          <div>
            <div class="workout-date">${formatDate(w.date)}</div>
            <div class="workout-name">${w.name||'Nimetön treeni'}</div>
            <div class="workout-status">${statusBadge}</div>
          </div>
          <div class="workout-arrow">▼</div>
        </div>
        ${isExpanded?`
          <div class="workout-details" onclick="event.stopPropagation()">
            ${w.exercises.map(ex=>`
              <div class="exercise-item">
                <div class="exercise-name">${ex.name}</div>
                ${ex.sets.map((s,i)=>{
                  const isFilled=s.reps && s.weight;
                  return `<div class="set-info ${isFilled?'filled':''}">Sarja ${i+1}: ${s.reps||'-'} toistoa × ${s.weight||'-'} kg</div>`;
                }).join('')}
              </div>
            `).join('')}
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              ${!isLocked?`<button class="edit-btn" onclick="event.stopPropagation();editWorkout('${w.id}')">✏️ Muokkaa</button>`:''}
              ${isLocked?
                `<button class="unlock-btn" onclick="event.stopPropagation();unlockWorkout('${w.id}')">🔓 Avaa lukitus</button>`:
                `<button class="lock-btn" onclick="event.stopPropagation();lockWorkout('${w.id}')">✅ Merkitse valmiiksi</button>`
              }
              <button class="btn btn-danger" onclick="event.stopPropagation();deleteWorkout('${w.id}')" style="flex:1">🗑️ Poista</button>
            </div>
          </div>
        `:''}
      </div>
    `;
  }).join('');
}

window.deleteWorkout=function(id){
  if(confirm('Poista tämä treeni?')){
    workouts=workouts.filter(w=>w.id!==id);
    expandedWorkouts.delete(id);
    saveToStorage();
    renderWorkoutList();
  }
};

window.toggleWorkout=toggleWorkout;
window.editWorkout=editWorkout;
window.lockWorkout=lockWorkout;
window.unlockWorkout=unlockWorkout;

window.addExerciseRow=function(){
  currentExercises.push({name:'',sets:[{reps:'',weight:''}]});
  renderExercises();
};

window.removeExercise=function(idx){
  if(confirm('Poista tämä liike?')){
    currentExercises.splice(idx,1);
    renderExercises();
  }
};

window.addSet=function(exIdx){
  currentExercises[exIdx].sets.push({reps:'',weight:''});
  renderExercises();
};

window.removeSet=function(exIdx,setIdx){
  currentExercises[exIdx].sets.splice(setIdx,1);
  renderExercises();
};

window.updateExerciseName=function(idx,value){
  currentExercises[idx].name=value;
};

window.selectExercise=function(idx,value){
  if(value){
    currentExercises[idx].name=value;
    const nameInput=document.getElementById('exName-'+idx);
    if(nameInput)nameInput.value=value;
  }
};

window.updateSet=function(exIdx,setIdx,field,value){
  currentExercises[exIdx].sets[setIdx][field]=value;
};

function renderExercises(){
  const container=document.getElementById('exercisesList');
  if(currentExercises.length===0){
    container.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">Ei liikkeitä vielä. Lisää ensimmäinen liike alla olevalla napilla.</div>';
    return;
  }
  const optionsHtml=buildExerciseOptions();
  container.innerHTML=currentExercises.map((ex,exIdx)=>`
    <div class="exercise-row">
      <div class="category-label">Valitse liike kategoriasta tai kirjoita oma:</div>
      <select onchange="selectExercise(${exIdx},this.value)">
        ${optionsHtml}
      </select>
      <div class="exercise-header">
        <input type="text" id="exName-${exIdx}" placeholder="Liikkeen nimi" value="${ex.name}" 
               oninput="updateExerciseName(${exIdx},this.value)">
        <button class="remove-exercise-btn" onclick="removeExercise(${exIdx})">🗑️ Poista liike</button>
      </div>
      <div class="category-label">Sarjat:</div>
      ${ex.sets.map((set,setIdx)=>`
        <div class="set-row">
          <div class="set-num">${setIdx+1}.</div>
          <input type="number" placeholder="Toistot" value="${set.reps}" 
                 oninput="updateSet(${exIdx},${setIdx},'reps',this.value)">
          <input type="number" step="0.5" placeholder="Paino (kg)" value="${set.weight}" 
                 oninput="updateSet(${exIdx},${setIdx},'weight',this.value)">
          <button class="remove-set-btn" onclick="removeSet(${exIdx},${setIdx})" title="Poista sarja">✕</button>
        </div>
      `).join('')}
      <button class="add-btn" onclick="addSet(${exIdx})" style="margin-top:8px;padding:8px">+ Lisää sarja</button>
    </div>
  `).join('');
}

function saveWorkout(){
  const date=document.getElementById('workoutDate').value;
  const name=document.getElementById('workoutName').value;
  
  if(!date){
    alert('Valitse päivämäärä');
    return;
  }
  
  if(currentExercises.length===0){
    alert('Lisää vähintään yksi liike');
    return;
  }
  
  const validExercises=currentExercises.filter(ex=>ex.name.trim()!=='');
  if(validExercises.length===0){
    alert('Anna vähintään yhdelle liikkeelle nimi');
    return;
  }
  
  const workoutData={
    date:date,
    name:name,
    exercises:validExercises.map(ex=>({
      name:ex.name,
      sets:ex.sets.filter(s=>s.reps||s.weight).map(s=>({
        reps:parseFloat(s.reps)||0,
        weight:parseFloat(s.weight)||0
      }))
    }))
  };
  
  if(editingWorkoutId){
    // Päivitä olemassa oleva treeni
    const idx=workouts.findIndex(w=>w.id===editingWorkoutId);
    if(idx!==-1){
      workouts[idx]={...workouts[idx],...workoutData};
    }
    editingWorkoutId=null;
    document.getElementById('editingBanner').style.display='none';
    document.getElementById('logTitle').textContent='Uusi treeni';
    alert('Treeni päivitetty!');
  } else {
    // Luo uusi treeni
    workouts.push({
      id:generateId(),
      locked:false,
      ...workoutData
    });
    alert('Treeni tallennettu!');
  }
  
  saveToStorage();
  
  document.getElementById('workoutName').value='';
  currentExercises=[];
  renderExercises();
  
  document.getElementById('navOverview').click();
}

document.getElementById('navOverview').addEventListener('click',function(){
  editingWorkoutId=null;
  currentExercises=[];
  document.getElementById('editingBanner').style.display='none';
  document.getElementById('logTitle').textContent='Uusi treeni';
  document.getElementById('workoutName').value='';
  document.getElementById('workoutDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('pageOverview').style.display='block';
  document.getElementById('pageLog').style.display='none';
  this.classList.add('active');
  document.getElementById('navLog').classList.remove('active');
  renderWorkoutList();
});

document.getElementById('navLog').addEventListener('click',function(){
  if(editingWorkoutId){
    if(!confirm('Olet muokkaamassa treeniä. Haluatko peruuttaa muutokset?')){
      return;
    }
    editingWorkoutId=null;
    currentExercises=[];
    document.getElementById('editingBanner').style.display='none';
    document.getElementById('logTitle').textContent='Uusi treeni';
  }
  document.getElementById('pageOverview').style.display='none';
  document.getElementById('pageLog').style.display='block';
  this.classList.add('active');
  document.getElementById('navOverview').classList.remove('active');
  document.getElementById('workoutDate').value=new Date().toISOString().split('T')[0];
  renderExercises();
});

document.getElementById('exportBtn').addEventListener('click',exportData);

document.getElementById('importBtn').addEventListener('click',function(){
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(file){
    importData(file);
  }
  e.target.value='';
});

document.getElementById('addExercise').addEventListener('click',window.addExerciseRow);
document.getElementById('saveWorkout').addEventListener('click',saveWorkout);
document.getElementById('searchInput').addEventListener('input',renderWorkoutList);

document.getElementById('workoutDate').value=new Date().toISOString().split('T')[0];
renderWorkoutList();
renderExercises();
</script>
</body>
</html>
